# Per-repo verifier config. MEASURED 2026-08-25, not estimated:
#   .venv/bin/pytest tests/ -q        -> 218 passed in 864s (14m24s), exit 0
#   .venv/bin/python verify_claims.py -> exit 0 in 393s (6m33s)
#
# The Stop hook allows 600s for the whole verifier, so the python suite cannot
# run there: it would time out on every stop and sit permanently red, which is
# how a gate gets ignored. It is SKIPPED here and remains covered by CI, which
# runs `pytest tests/ -q` on every push.
#
# To run the full thing locally:  VERIFY_SKIP_PYTEST=0 ./.claude/verify.sh
VERIFY_SKIP_PYTEST=1

# verify_claims.py alone needs 393s, so the per-step cap must clear it.
STEP_TIMEOUT=430
