name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. Without this the default token is read/write across every
# scope on push events; nothing here needs to write. (Audit finding.)
permissions:
  contents: read

jobs:
  contracts:
    name: Foundry contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1

      # contracts/lib/ is gitignored, so EVERY dependency has to be installed
      # here. Only forge-std was, while src/ imports OpenZeppelin
      # (SafeERC20, IERC20, ReentrancyGuard) — so CI could not compile at all
      # and had been red since OpenZeppelin was introduced.
      - name: Install contract dependencies
        working-directory: contracts
        run: |
          # PINNED. Unpinned, these resolve to whatever is on the default
          # branch at run time, so CI could compile the contracts against a
          # different OpenZeppelin than the one the live mainnet contracts were
          # built with — and a cold clone could not reproduce the deployed
          # bytecode. These are the versions the 2026-07-30 deploy used.
          forge install foundry-rs/forge-std@v1.16.1 --shallow --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --shallow --no-git

      - name: Show resolved remappings
        working-directory: contracts
        run: forge remappings

      # No fork env vars on purpose: the fork-gated suites read MONAD_RPC_URL
      # through vm.envOr and self-skip when it is absent, so this runs the
      # deterministic suite without depending on a live RPC in CI.
      - name: Run contract test suite
        working-directory: contracts
        run: forge test

  test:
    name: Python test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Previously this ran two files directly as scripts. Six of the seven
      # test modules use pytest fixtures and parametrisation, so they never
      # ran in CI at all — including the negative tests covering key pinning
      # and the hedge policy, which are the two highest-severity fixes here.
      - name: Run the full Python suite
        run: pytest tests/ -q

      - name: Verify shipped artefacts (signed orders + audit chain)
        # signed_orders.json and audit_log.jsonl ship as reproducibility
        # artefacts: every embedded order must verify under all three
        # signature schemes, and the hash chain must be intact. A reviewer who
        # clones the repo can run exactly this, offline.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from src import orders
          for s in orders.load_signed_orders():
              assert orders.verify_signed_order(s), s.order.order_id
              print('verified', s.order.order_id, 'pools=', s.order.pools)
          ok, n, reason = orders.verify_audit_chain()
          assert ok, f'audit chain broken: {reason}'
          print(f'audit chain intact: {n} entries')
          PY

  claims:
    name: documented claims match the artefacts
    runs-on: ubuntu-latest
    steps:
      # Full history: the claims check verifies that the commit pinned on the
      # pitch deck's closing slide is actually in this repository's history.
      # The default depth-1 clone does not contain it, which fails the check
      # for want of history rather than for a bad pin.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # forge is needed: the check compares the DOCUMENTED test total against
      # what both suites actually report, so it must be able to run them.
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install contract dependencies
        working-directory: contracts
        run: |
          # PINNED. Unpinned, these resolve to whatever is on the default
          # branch at run time, so CI could compile the contracts against a
          # different OpenZeppelin than the one the live mainnet contracts were
          # built with — and a cold clone could not reproduce the deployed
          # bytecode. These are the versions the 2026-07-30 deploy used.
          forge install foundry-rs/forge-std@v1.16.1 --shallow --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --shallow --no-git
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Recomputes P(optimal) and the feasible fraction from the raw shipped
      # counts and asserts the stored summaries match, then checks every
      # documented test count against what the suites actually report.
      # Chain checks are omitted so CI does not depend on a live RPC.
      - name: Verify claims
        run: python verify_claims.py

  imports:
    name: source imports cleanly on Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import importlib
          for m in ['src.pq_signing', 'src.orders', 'src.problem',
                    'src.solvers', 'src.qaoa_hw', 'src.xy_qaoa',
                    'src.ai_forecast', 'src.backtest', 'src.data',
                    'src.defi_data', 'src.hardware', 'src.quoter',
                    'src.keystore', 'src.monad_tx']:
              importlib.import_module(m)
              print(f'imports OK: {m}')
          import py_compile
          py_compile.compile('app.py', doraise=True)
          print('app.py compiles OK')
          PY

  # Everything above runs in-place with no chain access, which is the right
  # default for speed — but it means the mainnet-facing half of the claim gate
  # and the fork-gated contract tests were only ever exercised BY HAND. That is
  # not a control: on 2026-08-17 an audit found "every documented reviewer
  # command executed against mainnet in CI" was false, that a fork test had been
  # reporting PASS without touching a chain, and that "0 skipped with an RPC
  # endpoint" was unreachable because the fork suites need the pool parameters
  # too. This job runs what a reviewer actually runs.
  mainnet-verification:
    name: fork tests + on-chain claim gate (live Monad mainnet)
    runs-on: ubuntu-latest
    # A public RPC can rate-limit or blip. This job asserts real things, so a
    # red here is worth investigating — but it must not gate the deterministic
    # suites above, which depend on nothing external.
    continue-on-error: true
    env:
      MONAD_RPC_URL: https://rpc.monad.xyz
      # The only genuinely liquid WMON pair on Monad mainnet: USDC, 0.3% tier.
      FORK_TOKEN_OUT: "0x754704Bc059F8C67012fEd69BC8A327a5aafb603"
      FORK_FEE: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install contract dependencies
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.1 --shallow --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --shallow --no-git

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # With the full fork env the documented promise is 0 skipped. Assert it
      # rather than eyeballing it: a skip here means a fork test silently
      # stopped exercising mainnet, which is how the last one hid.
      - name: Foundry suite against live mainnet (0 skipped)
        working-directory: contracts
        run: |
          set -o pipefail
          forge test | tee /tmp/forge.txt
          tail -3 /tmp/forge.txt | grep -qE '[0-9]+ tests passed, 0 failed, 0 skipped' \
            || { echo "::error::expected 0 skipped with the full fork env"; exit 1; }

      # The half CI never ran: recomputes the anchored execCommitment against
      # AuditAnchorV2 on chain, replays the documented cast calls, and asserts
      # the tampered execution still reverts.
      - name: Claim gate including on-chain checks
        run: python verify_claims.py --chain
